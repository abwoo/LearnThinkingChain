<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>ThinkingChain Hub</title>
    <link rel="stylesheet" href="dashboard.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body class="hub-root">
    <div class="app-shell">
        <!-- Dashboard Sidebar -->
        <nav class="hub-nav">
            <div class="brand-v3">
                <div class="logo-circle"></div>
                <div class="brand-info">
                    <span class="app-name">LT CHAIN</span>
                    <span class="app-status">ENGINE ACTIVE</span>
                </div>
            </div>

            <div class="nav-links-v3">
                <div class="nav-btn active">控制中心</div>
                <div class="nav-btn">框架工坊</div>
                <div class="nav-btn">原始记忆</div>
            </div>

            <div class="nav-footer">
                <button id="reset-profile" class="btn-danger">格式化认知核</button>
            </div>
        </nav>

        <!-- Main Workspace -->
        <main class="hub-main">
            <header class="hub-header">
                <div class="header-left">
                    <h1 id="active-mode">加载中...</h1>
                    <p id="mode-banner-text">正在同步实时指令集</p>
                </div>
                <div class="header-right">
                    <div class="sync-status">
                        <span class="pulse-ring"></span>
                        实时同步已开启
                    </div>
                </div>
            </header>

            <div class="bento-container">
                <!-- 1. Interactive Memory Editor -->
                <div class="bento-item memory-hub glass-v3">
                    <div class="bento-head">
                        <h3>认知记忆库 (Memory Bank)</h3>
                        <p>手动干预或查看已被识别的知识盲点</p>
                    </div>
                    <div class="memory-controls">
                        <input type="text" id="new-gap-input" placeholder="添加知识锚点...">
                        <button id="add-gap-btn">新增</button>
                    </div>
                    <ul id="gaps-list" class="interactive-tags">
                        <!-- Tags injected by JS -->
                    </ul>
                </div>

                <!-- 2. Live Chain Visualizer -->
                <div class="bento-item live-feed glass-v3">
                    <div class="bento-head">
                        <h3>思维脉冲 (Neural Pulse)</h3>
                    </div>
                    <div id="live-chain" class="chain-v3-list">
                        <!-- Chain steps injected by JS -->
                    </div>
                </div>

                <!-- 3. Prompt Web Editor / Preview -->
                <div class="bento-item brain-preview glass-v3 full-width">
                    <div class="bento-head">
                        <h3>大脑仿真预览 (Brain Simulation)</h3>
                        <p>输入测试提问，实时查看“认知框架”是如何封装指令的</p>
                    </div>
                    <div class="preview-workspace">
                        <div class="preview-input-group">
                            <label>模拟输入 (Input)</label>
                            <textarea id="preview-test-input">如何解释费米悖论？</textarea>
                        </div>
                        <div class="preview-output-group">
                            <label>封装后指令 (System Prompt Output)</label>
                            <pre id="current-protocol-code" class="fira-code">
                                <!-- Code injected by JS -->
                            </pre>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="dashboard.js"></script>
</body>

</html>
