<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LearnThinkingChain 框架看板</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="framework-body">
    <main class="framework-app">
      <header class="framework-header">
        <div>
          <h1>框架管理</h1>
          <p class="dim">仅保留“自定义框架”功能</p>
        </div>
        <div class="framework-connection">
          <input
            type="text"
            id="extension-id-input"
            class="extension-input"
            placeholder="输入扩展 ID"
            aria-label="Extension ID"
          />
          <span id="connection-status" class="status-off">DISCONNECTED</span>
        </div>
      </header>

      <section class="framework-panel">
        <div class="framework-form">
          <input
            id="framework-input"
            class="extension-input"
            placeholder="输入框架名称"
            aria-label="框架名称"
          />
          <button class="btn-glass" id="add-framework-btn">添加框架</button>
        </div>
        <div id="framework-list" class="framework-list"></div>
      </section>
    </main>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
