<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LT Chain Cloud Hub</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="glass-master">
    <div class="cloud-app">
      <aside class="sidebar-glass">
        <div class="nav-brand">
          <div class="logo-orb"></div>
          <div class="brand-info">
            <h1>THINKING CHAIN</h1>
            <span class="cloud-badge">CLOUD HUB</span>
          </div>
        </div>

        <nav class="hub-nav">
          <div class="nav-link active" data-view="history">
            <span class="nav-icon">🕘</span> 历史记录
          </div>
          <div class="nav-link" data-view="workshop">
            <span class="nav-icon">⚒</span> 框架工坊
          </div>
        </nav>

        <div class="nav-status">
          <div class="dot green"></div>
          <span>Extensions Linked</span>
        </div>
      </aside>

      <main class="viewport">
        <section id="history-view" class="view active">
          <div class="view-header">
            <h2>历史记录 <span class="dim">History</span></h2>
            <div class="sync-controls">
              <input
                type="text"
                id="extension-id-input"
                class="extension-input"
                placeholder="Enter Plugin ID"
                aria-label="Extension ID"
              />
            </div>
          </div>
          <div class="glass" style="padding: 18px; border-radius: 18px;">
            <div id="live-chain" class="chain-stream"></div>
          </div>
        </section>

        <section id="workshop-view" class="view">
          <div class="view-header">
            <h2>框架工坊 <span class="dim">Framework Workshop</span></h2>
          </div>
          <div class="framework-board">
            <div class="framework-list glass">
              <div class="board-header">
                <h3>框架列表</h3>
                <button class="btn-primary" id="framework-add">新增框架</button>
              </div>
              <div id="framework-list" class="framework-items"></div>
            </div>
            <div class="framework-editor glass">
              <div class="board-header">
                <h3>框架编辑器</h3>
                <span class="editor-status" id="framework-status">未同步</span>
              </div>
              <label class="editor-label" for="framework-name">Framework Name</label>
              <input id="framework-name" class="extension-input" type="text" placeholder="输入框架名称" />
              <label class="editor-label" for="framework-description">Description</label>
              <textarea id="framework-description" class="extension-input" rows="2" placeholder="简短描述"></textarea>
              <label class="editor-label" for="framework-prompt">System Prompt Template</label>
              <textarea id="framework-prompt" class="mono" rows="10" placeholder="请输入系统提示词模板"></textarea>
              <div class="framework-actions">
                <button class="btn-glass" id="framework-save">保存 / 更新</button>
                <button class="btn-glass" id="framework-delete">删除</button>
                <button class="btn-primary" id="framework-set-active">设为当前注入</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 认知档案已移除 -->
      </main>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
