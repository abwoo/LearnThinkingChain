# Deploy Dashboard to GitHub Pages
name: Deploy Dashboard to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build:web

      - name: Check build output
        run: |
          if [ ! -d "dist/web" ]; then
            echo "Build failed: dist/web directory not found"
            exit 1
          fi
          echo "Build output found:"
          ls -la dist/web/ | head -20
          [ -f "dist/web/index.html" ] && echo "✓ index.html exists" || echo "✗ index.html missing"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/web'
        if: success()

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: success()
