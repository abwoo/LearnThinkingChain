name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Linter completed with warnings"
        continue-on-error: true

      - name: Type check
        run: npm run type-check
        continue-on-error: false

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy icon files
        run: |
          if [ -d "extension/icons" ]; then
            mkdir -p apps/extension/icons
            cp -r extension/icons/* apps/extension/icons/
          fi

      - name: Build extension
        run: npm run build
        continue-on-error: false

      - name: Check build output
        run: |
          if [ ! -d "dist/extension" ]; then
            echo "Build failed: dist/extension directory not found"
            exit 1
          fi
          echo "Build output found:"
          ls -la dist/extension/ | head -20
          echo "Checking for required files:"
          [ -f "dist/extension/manifest.json" ] && echo "✓ manifest.json exists" || echo "✗ manifest.json missing"
          [ -f "dist/extension/popup.html" ] && echo "✓ popup.html exists" || echo "✗ popup.html missing"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: dist/extension
          retention-days: 7
        if: success()

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || echo "Tests not configured, skipping..."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
