<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>LearnThinkingChain</title>
    <style>
        body {
            width: 300px;
            padding: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: #202124;
        }

        h1 {
            font-size: 18px;
            margin-top: 0;
            color: #1a73e8;
        }

        .profile-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #dadce0;
        }

        .stat {
            margin-bottom: 8px;
        }

        .label {
            font-size: 12px;
            color: #5f6368;
            font-weight: bold;
        }

        .value {
            font-size: 14px;
        }

        .footer {
            margin-top: 16px;
            font-size: 11px;
            color: #70757a;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>LearnThinkingChain</h1>
    <div class="stat">
        <span class="label">Status:</span>
        <span id="status-val" class="value">Loading...</span>
    </div>

    <div class="profile-card">
        <div class="stat">
            <span class="label">Knowledge Gaps:</span>
            <div id="gaps-val" class="value">None yet</div>
        </div>
        <div class="stat">
            <span class="label">Thinking Styles:</span>
            <div id="styles-val" class="value">Analyzing...</div>
        </div>
    </div>

    <div class="footer">
        Cognitive Process Emulator for Gemini
    </div>

    <button id="open-dashboard" style="
        width: 100%;
        padding: 10px;
        margin-top: 16px;
        background: #4285f4;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        transition: background 0.2s;
    ">查看详细认知看板</button>

    <script src="popup.js"></script>
</body>

</html>
